name: Deploy to GitHub Pages

on:
  push:
    branches:
      - modern-redesign/angular-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build -- --configuration production

      - name: Configure Git Pages base href
        run: |
          sed -Ei 's|<base href="/"[[:space:]]*/?>|<base href="/Personal-Portfolio-Angular/" />|' dist/Personal-Portfolio-Angular/browser/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/Personal-Portfolio-Angular/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3