<section id="contact" class="section">
  <div class="container">
    <div class="contact-card card">
      <div class="contact-copy">
        <p class="section-eyebrow">Contact</p>
        <h2 class="section-title">Have a project or opportunity?</h2>
        <p class="section-description">Send a message and I’ll get back to you as soon as possible.</p>

        <div class="contact-links">
          <a href="mailto:punithraaj14@gmail.com">punithraaj14@gmail.com</a>
          <a href="tel:+918088041006">+91 8088041006</a>
        </div>
      </div>

      <form class="contact-form" (ngSubmit)="onSubmit(model.name || '', model.subject || '', model.email || '', model.message || '')" novalidate>
        <label>
          Name
          <input type="text" name="name" [(ngModel)]="model.name" required placeholder="Your name">
        </label>

        <label>
          Subject
          <input type="text" name="subject" [(ngModel)]="model.subject" required placeholder="Project topic">
        </label>

        <label>
          Email
          <input type="email" name="email" [(ngModel)]="model.email" required placeholder="you@example.com">
        </label>

        <label>
          Message
          <textarea name="message" [(ngModel)]="model.message" required rows="5" placeholder="Tell me about your project"></textarea>
        </label>

        <button class="btn btn-primary" type="submit">Send message</button>
      </form>
    </div>
  </div>
</section>
