<section id="education" class="section section-muted">
  <div class="container">
    <div class="section-heading">
      <p class="section-eyebrow">Education</p>
      <h2 class="section-title">Academic foundation.</h2>
      <p class="section-description">Training in computer engineering fundamentals and hands-on technical programs.</p>
    </div>

    <div class="education-grid">
      @for (item of educationItems; track item.school) {
        <article class="card education-card" data-aos="fade-up">
          <p class="edu-period">{{ item.period }}</p>
          <h3>{{ item.title }}</h3>
          <p class="edu-school">{{ item.school }}</p>
          <span>{{ item.detail }}</span>
        </article>
      }
    </div>
  </div>
</section>
