<header class="site-header">
  <nav class="nav-shell container" aria-label="Primary navigation">
    <a class="brand" [class.is-active]="activeSection() === 'home'" href="#home" (click)="navigateToSection($event, 'home')">
      <span class="brand-mark">P</span>
      <span>Punithraj M N</span>
    </a>
    <button
      class="menu-toggle"
      type="button"
      aria-label="Toggle navigation"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
    <div id="primary-navigation" class="nav-links" [class.is-open]="menuOpen">
      @for (item of navigationItems; track item.id) {
        <a
          [href]="'#' + item.id"
          [class.is-active]="activeSection() === item.id"
          [attr.aria-current]="activeSection() === item.id ? 'location' : null"
          (click)="navigateToSection($event, item.id)">
          {{ item.label }}
        </a>
      }
    </div>
  </nav>
</header>
